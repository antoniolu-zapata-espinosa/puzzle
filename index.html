<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Mi Rompecabezas Mágico!</title>
    
    <style>
        /* Fondo infantil colorido con diseño de nubes */
        body {
            font-family: 'Arial Round', 'Comic Sans MS', sans-serif;
            background: #87CEEB; /* Azul cielo */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.8) 50%, transparent 60%),
                radial-gradient(circle at 35% 40%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.8) 50%, transparent 60%),
                radial-gradient(circle at 75% 20%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.8) 50%, transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.8) 50%, transparent 60%);
            background-size: 400px 400px;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            text-shadow: 3px 3px 0px #FF4081, -1px -1px 0px #FF4081, 1px -1px 0px #FF4081, -1px 1px 0px #FF4081;
            font-size: 2.2rem;
            margin: 5px 0 15px 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: 3px solid #fff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px #2E7D32;
            transition: all 0.1s ease;
        }
        button:active {
            box-shadow: 0 2px #2E7D32;
            transform: translateY(4px);
        }

        #changeImgBtn {
            background-color: #00BCD4;
            box-shadow: 0 6px #0097A7;
        }

        /* Zona de juego: Coloca los dos tableros uno al lado del otro */
        .game-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 100%;
        }

        /* Caja de los dos tableros */
        .board-box {
            position: relative;
            width: 320px;
            height: 400px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 8px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Guías visuales del tablero destino */
        #target-board {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.4) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(255,255,255,0.4) 2px, transparent 2px);
            background-size: 80px 80px;
        }

        /* Estilo de las piezas */
        .piece {
            position: absolute;
            width: 80px;  /* 320px / 4 columnas */
            height: 80px; /* 400px / 5 filas */
            box-sizing: border-box;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            cursor: grab;
            touch-action: none; 
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
        }
        .piece:active {
            cursor: grabbing;
            z-index: 999;
            transform: scale(1.08);
            box-shadow: 0 12px 16px rgba(0,0,0,0.3);
        }

        /* Cuando la pieza ya encajó */
        .piece.placed {
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        /* Cartel de ganar */
        #win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 25px;
            border: 5px solid #FF4081;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 9999;
            width: 80%;
            max-width: 320px;
        }
        #win-message h2 {
            color: #FF4081;
            font-size: 2.2rem;
            margin: 0 0 15px 0;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="musicBtn" onclick="toggleMusic()">🎵 Música: NO</button>
        <button id="changeImgBtn" onclick="changeImage()">🖼️ Cambiar Foto</button>
    </div>

    <div class="game-zone">
        <!-- Izquierda: Piezas desordenadas -->
        <div id="source-board" class="board-box"></div>
        <!-- Derecha: Destino vacío -->
        <div id="target-board" class="board-box"></div>
    </div>

    <!-- Mensaje de victoria -->
    <div id="win-message">
        <h2>¡Felicidades! 🎉🌟</h2>
        <p style="font-size: 1.2rem; color: #555;">¡Lo lograste genial!</p>
        <button onclick="restartGame()" style="background-color: #FF4081; box-shadow: 0 6px #C2185B;">Jugar otra vez</button>
    </div>

                    positions.push({ x: c * PIECE_WIDTH, y: r * PIECE_HEIGHT });

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.style.backgroundImage = `url('${currentImage}')`;
                    piece.style.backgroundSize = '320px 400px';
                    piece.style.backgroundPosition = `-${c * PIECE_WIDTH}px -${r * PIECE_HEIGHT}px`;
                    
                    let targetX = c * PIECE_WIDTH;
                    let targetY = r * PIECE_HEIGHT;

                    let startPos = positions[index++];
                    piece.style.left = `${startPos.x}px`;
                    piece.style.top = `${startPos.y}px`;

                    makeDraggable(piece, targetX, targetY);
                    sourceBoard.appendChild(piece);
                }
            }
        }
