    <title>¡Mi Rompecabezas Mágico!</title>
    
    <style>

        body {

            background-size: 400px 400px;

            box-sizing: border-box;
        }

        h1 {
            color: #fff;

            margin: 5px 0 15px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: 3px solid #fff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px #2E7D32;
            transition: all 0.1s ease;
        }
        button:active {
            box-shadow: 0 2px #2E7D32;
            transform: translateY(4px);
        }

        #changeImgBtn {
            background-color: #00BCD4;
            box-shadow: 0 6px #0097A7;
        }

        .game-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 100%;
        }

        .board-box {
            position: relative;
            width: 320px;
            height: 400px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 8px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        #target-board {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.4) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(255,255,255,0.4) 2px, transparent 2px);
            background-size: 80px 80px;
        }

        .piece {
            position: absolute;
            width: 80px;  
            height: 80px; 
            box-sizing: border-box;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            cursor: grab;
            touch-action: none; 
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
        }
        .piece:active {
            cursor: grabbing;
            z-index: 999;
            transform: scale(1.08);
            box-shadow: 0 12px 16px rgba(0,0,0,0.3);
        }

        .piece.placed {
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        #win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 25px;
            border: 5px solid #FF4081;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 9999;
            width: 80%;
            max-width: 320px;
        }
        #win-message h2 {
            color: #FF4081;
            font-size: 2.2rem;
            margin: 0 0 15px 0;
        }
    </style>

        // --- MOTOR DE AUDIO GENERADO POR CÓDIGO (Inmune a bloqueos) ---
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Tono corto al levantar o mover una pieza
        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime); // Tono medio suave
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Tono alegre ascendente (¡Acierto!)
        function playSuccessSound() {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            
            // Primer tono feliz
            let osc1 = audioCtx.createOscillator();
            let gain1 = audioCtx.createGain();
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.frequency.setValueAtTime(523.25, now); // Nota Do
            gain1.gain.setValueAtTime(0.1, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc1.start(); osc1.stop(now + 0.1);

            // Segundo tono feliz más agudo inmediatamente después
            setTimeout(() => {
                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // Nota Mi
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc2.start(); osc2.stop(audioCtx.currentTime + 0.15);
            }, 80);
        }

        // Melodía infantil rítmica cíclica generada por síntesis matemática
        function startMelody() {
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 392.00, 440.00, 392.00]; // Melodía simple infantil
            let step = 0;
            
            musicInterval = setInterval(() => {
                if (!isMusicPlaying) return;
                initAudio();
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                osc.type = 'sine'; // Tono dulce
                osc.frequency.setValueAtTime(notes[step], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime); // Volumen bajito de fondo
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
                
                step = (step + 1) % notes.length;
            }, 400); // Ritmo alegre constante
        }
