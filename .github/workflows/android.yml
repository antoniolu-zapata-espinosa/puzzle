name: Build Android APK Direct

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Prepare Assets Folder
      run: |
        mkdir -p www
        cp index.html www/
        if [ -f imagenes.json ]; then cp imagenes.json www/; fi
        if [ -d imagenes ]; then cp -r imagenes www/; fi

    - name: Build Android APK
      uses: unvwired/build-android-action@v1.0
      with:
        app-name: "Puzzle Sorpresa"
        input-dir: "www"
        package-name: "com.puzzle.hija"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PuzzleHija-APK
        path: app-debug.apk


