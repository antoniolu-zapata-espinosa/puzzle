name: Build Android APK Official

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del juego
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Node.js oficial
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Configurar Java (Requisito oficial de Google para compilar Android)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. Instalar y configurar Bubblewrap (La herramienta oficial de Google)
    - name: Install Google Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    # 5. Crear la estructura nativa y compilar el archivo APK
    # Usamos comandos automatizados para saltar las preguntas de configuración inicial
     King-size android compilation setup
    - name: Initialize and Build Android App
      run: |
        # Crear un archivo de configuración mínimo para Bubblewrap
        bubblewrap init --manifest="https://vercel.app" --meta-package="com.puzzle.hija" --ask-arguments=false
        
        # Generar el entorno nativo de Android
        bubblewrap build --skipSigning
        
        # Mover el archivo resultante a una carpeta limpia para guardarlo
        mkdir -p output-apk
        cp app-release-unsigned.apk output-apk/puzzle-hija.apk || cp *.apk output-apk/

    # 6. Guardar el archivo APK listo para descargar
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PuzzleHija-APK
        path: output-apk/
