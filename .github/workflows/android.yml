name: Build Android APK Direct

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar los archivos del juego
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2

    # 2. Estructurar la carpeta interna del juego
    - name: Prepare Assets Folder
      run: |
        mkdir -p www
        cp index.html www/
        if [ -f imagenes.json ]; then cp imagenes.json www/; fi
        if [ -d imagenes ]; then cp -r imagenes www/; fi

    # 3. Compilar directamente el HTML a una App Nativa usando contenedores estables
    - name: Build Android APK
      uses: fllesno/android-build-action@v1
      with:
        app-name: "Puzzle Sorpresa"
        package-id: "com.puzzle.hija"
        web-dir: "www"

    # 4. Guardar y entregar el APK listo para descargar
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: PuzzleHija-APK
        path: "*.apk"
