<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡El Gran Rompecabezas Sorpresa!</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #ff7675;
            --accent: #74b9ff;
            --bg: #ffeaa7;
        }
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        h1 {
            color: #d63031;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 0px #fff;
        }
        h2 {
            color: #2d3436;
            margin: 0 0 15px 0;
            font-size: 18px;
            background: white;
            padding: 5px 15px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .controls {
            background: white;
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0px #ee5253;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        .btn-blue {
            background: var(--accent);
            box-shadow: 0 4px 0px #0984e3;
        }
        
        /* 🧱 CONTENEDOR PRINCIPAL EN HORIZONTAL 🧱 */
        .game-layout {
            display: flex;
            flex-direction: row; /* Alinea los elementos uno al lado del otro */
            gap: 30px;           /* Espacio de separación entre el tablero y el pozo */
            align-items: flex-start;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }

        #board-container {
            position: relative;
            width: 500px;
            height: 400px;
            background: rgba(255, 255, 255, 0.6);
            border: 4px dashed #b2bec3;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            flex-shrink: 0; /* Evita que el tablero se encoja */
        }
        .grid-slot {
            position: absolute;
            border: 1px rgba(0,0,0,0.15) solid;
            box-sizing: border-box;
        }
        
        #pieces-pool {
            width: 500px;
            min-height: 400px; /* Ajustado para emparejar la altura con el tablero */
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-content: flex-start; /* Alinea las piezas sueltas desde arriba */
        }
        .piece {
            position: absolute;
            cursor: grab;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            border-radius: 4px;
            touch-action: none;
            z-index: 10;
        }
        .piece:active { cursor: grabbing; z-index: 100; }
        .piece.in-pool {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #win-message {
            display: none;
            color: #27ae60;
            font-size: 28px;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #fff;
        }

        /* Ajuste automático para pantallas móviles verticales */
        @media (max-width: 1050px) {
            .game-layout {
                flex-direction: column;
                align-items: center;
            }
            #pieces-pool {
                min-height: 120px;
                width: 500px;
            }
        }
    </style>
</head>
<body>

    <h1>🧩 ¡Rompecabezas Sorpresa! 🧩</h1>
    <h2 id="image-title">Buscando foto...</h2>

    <div class="controls">
        <button onclick="initPuzzle()">Reiniciar este puzzle</button>
        <button class="btn-blue" onclick="selectRandomImage()">🎲 ¡Cambiar imagen al azar!</button>
    </div>

    <!-- Nuevo contenedor que envuelve ambos elementos para ponerlos de lado a lado -->
    <div class="game-layout">
        <!-- Izquierda: Zona de encaje -->
        <div id="board-container"></div>
        
        <!-- Derecha: Zona de piezas desordenadas -->
        <div id="pieces-pool"></div>
    </div>

    <div id="win-message">🎉 ¡Felicidades! ¡Lo lograste! 🎉</div>

    <script>
        const COLS = 5;
        const ROWS = 4;
        const TOTAL_PIECES = COLS * ROWS;
        const BOARD_WIDTH = 500;
        const BOARD_HEIGHT = 400;
        const PIECE_WIDTH = BOARD_WIDTH / COLS;
        const PIECE_HEIGHT = BOARD_HEIGHT / ROWS;

        const board = document.getElementById("board-container");
        const pool = document.getElementById("pieces-pool");
        const imageTitle = document.getElementById("image-title");
        const winMessage = document.getElementById("win-message");

        let piecesPlaced = 0;
        let currentImgUrl = null;
        let repository = [];

                        async function loadRepository() {
            try {
                const response = await fetch('imagenes.json');
                const fileNames = await response.json();
                
                // Corrección definitiva para procesar los nombres sin errores
                repository = fileNames.map(name => {
                    let cleanName = name.replace(/\.[^/.]+$/, ""); // Quita el .jpg o .png
                    return {
                        name: "🧩 " + cleanName,
                        url: `imagenes/${name}`
                    };
                });
                
                selectRandomImage();
            } catch (error) {
                imageTitle.textContent = "Error al cargar las fotos. Revisa imagenes.json";
                console.error(error);
            }
        }


                selectRandomImage();
            } catch (error) {
                imageTitle.textContent = "Error al cargar las fotos";
                console.error(error);
            }
        }

        function selectRandomImage() {
            if (repository.length === 0) return;
            
            let nextImg;
            if (repository.length === 1) {
                nextImg = repository[0];
            } else {
                const availableImages = repository.filter(img => img.url !== currentImgUrl);
                const randomIndex = Math.floor(Math.random() * availableImages.length);
                nextImg = availableImages[randomIndex];
            }

            currentImgUrl = nextImg.url;
            imageTitle.textContent = `Estás jugando: ${nextImg.name}`;
            initPuzzle();
        }

        function initPuzzle() {
            board.innerHTML = "";
            pool.innerHTML = "";
            winMessage.style.display = "none";
            piecesPlaced = 0;

            if (!currentImgUrl) return;
            let piecesArray = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const index = r * COLS + c;
                    const posX = c * PIECE_WIDTH;
                    const posY = r * PIECE_HEIGHT;

                    const slot = document.createElement("div");
                    slot.classList.add("grid-slot");
                    slot.style.width = `${PIECE_WIDTH}px`;
                    slot.style.height = `${PIECE_HEIGHT}px`;
                    slot.style.left = `${posX}px`;
                    slot.style.top = `${posY}px`;
                    board.appendChild(slot);

                    const piece = document.createElement("div");
                    piece.classList.add("piece", "in-pool");
                    piece.style.width = `${PIECE_WIDTH}px`;
                    piece.style.height = `${PIECE_HEIGHT}px`;
                    piece.style.backgroundImage = `url('${currentImgUrl}')`;
                    piece.style.backgroundSize = `${BOARD_WIDTH}px ${BOARD_HEIGHT}px`;
                    piece.style.backgroundPosition = `-${posX}px -${posY}px`;
                    
                    piece.dataset.correctX = posX;
                    piece.dataset.correctY = posY;

                    makeDraggable(piece);
                    piecesArray.push(piece);
                }
            }

            piecesArray.sort(() => Math.random() - 0.5);
            piecesArray.forEach(piece => pool.appendChild(piece));
        }

        function makeDraggable(el) {
            let startX, startY, isDragging = false;
            el.addEventListener('mousedown', dragStart);
            el.addEventListener('touchstart', dragStart, { passive: false });

            function dragStart(e) {
                if (el.dataset.locked === "true") return;
                isDragging = true;
                if (el.classList.contains('in-pool')) { 
                    el.classList.remove('in-pool'); 
                    board.appendChild(el); 
                }
                const clientX = e.touches ? e.touches.clientX : e.clientX;
                const clientY = e.touches ? e.touches.clientY : e.clientY;
                const rect = board.getBoundingClientRect();
                el.style.left = `${clientX - rect.left - (PIECE_WIDTH / 2)}px`;
                el.style.top = `${clientY - rect.top - (PIECE_HEIGHT / 2)}px`;
                startX = clientX - el.offsetLeft; 
                startY = clientY - el.offsetTop;
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            }

            function dragMove(e) {
